<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0f24">
<title>Olympus Chess Academy — Login</title>
<style>
:root{--bg:#0a0f24;--ink:#16204a;--gold:#ffd23f;--gold2:#f0a81d;--cream:#fff6d6;--text:#f6f7ff;--soft:#aeb8d8;--rose:#ff8fa3;--red:#ff7c82}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg)}
body{min-height:100dvh;overflow-x:hidden;color:var(--text);font-family:"Baloo 2","Fredoka","Trebuchet MS","Segoe UI",system-ui,sans-serif}
button,input{font:inherit}

/* ---------- WORLD ---------- */
.world{position:relative;isolation:isolate;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px 40px;overflow:hidden;
 background:radial-gradient(circle at 50% 0%,#2b3a8f 0%,transparent 55%),radial-gradient(circle at 85% 90%,rgba(255,210,63,.18),transparent 40%),linear-gradient(180deg,#0a0f24,#101a45)}
.floor{position:absolute;left:-40%;width:180%;height:60%;bottom:-18%;z-index:-3;transform:perspective(520px) rotateX(64deg);transform-origin:center bottom;
 background:conic-gradient(#25326e 25%,#0d1537 0 50%,#25326e 0 75%,#0d1537 0) 0 0/110px 110px;animation:floorMove 30s linear infinite;
 -webkit-mask-image:linear-gradient(transparent,#000 40%);mask-image:linear-gradient(transparent,#000 40%);opacity:.8}
@keyframes floorMove{to{background-position:0 220px}}
.glow{position:absolute;width:520px;height:520px;left:50%;top:44%;transform:translate(-50%,-50%);z-index:-2;border-radius:50%;background:radial-gradient(circle,rgba(255,210,63,.22),transparent 65%);animation:breathe 6s ease-in-out infinite}
@keyframes breathe{50%{transform:translate(-50%,-50%) scale(1.12);opacity:.7}}
.drift{position:absolute;inset:0;z-index:-2;pointer-events:none;overflow:hidden}
.drift img{position:absolute;bottom:-100px;opacity:.2;filter:drop-shadow(0 0 8px rgba(255,255,255,.55));animation:rise var(--d) linear infinite;animation-delay:var(--l)}
.drift img.g{opacity:.38;filter:drop-shadow(0 0 10px rgba(255,210,63,.8))}
@keyframes rise{to{transform:translate3d(var(--x),-115vh,0) rotate(var(--r))}}

/* galloping knight on the board */
.knight-run{position:absolute;bottom:7%;left:-12%;z-index:-1;filter:drop-shadow(0 8px 6px rgba(0,0,0,.5));animation:run 26s linear infinite;pointer-events:none}
.knight-run img{width:4rem;display:block}
.knight-run b{display:block;font-weight:400;animation:hop 1.1s ease-in-out infinite}
@keyframes run{to{transform:translateX(125vw)}}
@keyframes hop{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-34px) rotate(8deg)}}

/* ---------- CINEMATIC INTRO (6s, slow movie fade) ---------- */
.intro{position:fixed;inset:0;z-index:100;pointer-events:none;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;overflow:hidden;
 background:radial-gradient(circle at 50% 42%,#0b1030 0%,#04061a 55%,#010210 100%);animation:introOut 1.4s 4.6s cubic-bezier(.4,0,.2,1) forwards}
.intro .halo{position:absolute;width:720px;height:720px;left:50%;top:42%;transform:translate(-50%,-50%);border-radius:50%;opacity:0;
 background:radial-gradient(circle,rgba(255,210,63,.35),rgba(255,170,40,.1) 40%,transparent 68%);animation:haloIn 2.4s .2s ease-out forwards,haloPulse 2.2s 2.4s ease-in-out infinite alternate}
.intro .rays{position:absolute;width:1100px;height:1100px;left:50%;top:42%;margin:-550px 0 0 -550px;opacity:0;border-radius:50%;
 background:repeating-conic-gradient(from 0deg,rgba(255,215,90,.16) 0 4deg,transparent 4deg 18deg);
 -webkit-mask-image:radial-gradient(circle,#000 0%,transparent 62%);mask-image:radial-gradient(circle,#000 0%,transparent 62%);
 animation:raysIn 2.6s .5s ease-out forwards,raysSpin 22s linear infinite}
.intro .king{position:relative;width:min(46vw,190px);aspect-ratio:1;opacity:0;animation:kingIn 2.7s .3s cubic-bezier(.2,.7,.2,1) forwards,kingZoom 6s .3s linear forwards}
.intro .king img{width:100%;height:100%;display:block;object-fit:contain;animation:kingGlow 1.8s 1s ease-in-out infinite alternate}
.intro .king::after{content:"";position:absolute;inset:0;mix-blend-mode:screen;
 background:linear-gradient(115deg,transparent 38%,rgba(255,244,190,.95) 50%,transparent 62%) 160% 0/260% 100% no-repeat;
 -webkit-mask:url(logo.png) center/contain no-repeat;mask:url(logo.png) center/contain no-repeat;animation:shine 2.8s 1.8s ease-in-out forwards}
.intro .spark{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff3b0;box-shadow:0 0 12px 3px rgba(255,210,63,.8);opacity:0;animation:twinkle 1.6s ease-in-out infinite;animation-delay:var(--s)}
.intro .line{height:2px;width:0;margin-top:10px;background:linear-gradient(90deg,transparent,var(--gold),transparent);box-shadow:0 0 14px rgba(255,210,63,.6);animation:lineGrow 2.4s 1s ease forwards}
.intro .word{font-size:clamp(1.5rem,5.2vw,2.5rem);letter-spacing:1em;font-weight:800;color:var(--cream);opacity:0;text-shadow:0 0 18px rgba(255,210,63,.5);animation:wordIn 2.4s 1.6s ease-out forwards}
@keyframes haloIn{to{opacity:1}}
@keyframes haloPulse{from{transform:translate(-50%,-50%) scale(.95)}to{transform:translate(-50%,-50%) scale(1.12)}}
@keyframes raysIn{to{opacity:1}}
@keyframes raysSpin{to{transform:rotate(360deg)}}
@keyframes kingIn{from{opacity:0;transform:translateY(34px) scale(.78);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes kingZoom{from{scale:1}to{scale:1.3}}
@keyframes kingGlow{from{filter:drop-shadow(0 0 10px rgba(255,210,63,.4))}to{filter:drop-shadow(0 0 38px rgba(255,220,100,1))}}
@keyframes shine{to{background-position:-60% 0}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1.2)}}
@keyframes lineGrow{to{width:min(84vw,620px)}}
@keyframes wordIn{from{opacity:0;letter-spacing:1em}to{opacity:1;letter-spacing:.5em}}
@keyframes introOut{to{opacity:0;visibility:hidden;transform:scale(1.12)}}

/* ---------- HEADER ---------- */
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px;animation:slow 1.6s 5.1s both cubic-bezier(.2,.8,.2,1)}
.brand img{width:54px;height:54px;object-fit:contain;filter:drop-shadow(0 0 12px rgba(255,210,63,.5))}
.brand strong{display:block;font-size:1.15rem}
.brand small{color:var(--gold2);font-weight:700;letter-spacing:.14em;font-size:.68rem;text-transform:uppercase}
.tagline{font-size:clamp(1.9rem,6vw,3.2rem);font-weight:800;line-height:1;text-align:center;margin:6px 0 0;animation:slow 1.6s 5.3s both cubic-bezier(.2,.8,.2,1)}
.tagline em{font-style:normal;color:var(--gold)}
@keyframes slow{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}

/* ---------- MASCOT ---------- */
.stage{position:relative;width:210px;height:190px;margin-top:6px;margin-bottom:-52px;z-index:3;pointer-events:none;animation:drop 1.3s 5.5s both cubic-bezier(.3,1.5,.5,1)}
@keyframes drop{from{opacity:0;transform:translateY(-80px)}to{opacity:1;transform:none}}
.pip{width:100%;height:100%;overflow:visible;animation:idle 3.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes idle{50%{transform:translateY(-5px) rotate(1.2deg)}}
.pip *{transform-box:fill-box}
.hand{transition:transform .55s cubic-bezier(.3,1.4,.5,1)}
.stage.hide .hand.l{transform:translate(2px,-68px) rotate(8deg)}
.stage.hide .hand.r{transform:translate(-2px,-68px) rotate(-8deg)}
.stage.hide.peek .hand.r{transform:translate(22px,-40px) rotate(40deg)}
.pupils{transition:transform .12s ease-out}
.stage.hide:not(.peek) .pupils{opacity:0}
.pupils{transition:transform .12s ease-out,opacity .2s}
.mouth{opacity:0;transition:opacity .2s}
.stage .m-smile{opacity:1}
.stage.sad .m-smile,.stage.win .m-smile{opacity:0}
.stage.sad .m-sad{opacity:1}
.stage.win .m-win{opacity:1}
.stage.sad .pip{animation:headShake .5s}
@keyframes headShake{25%{transform:translateX(-10px) rotate(-6deg)}50%{transform:translateX(10px) rotate(6deg)}75%{transform:translateX(-6px)}}
.stage.win .pip{animation:jump .6s ease-in-out 3}
@keyframes jump{50%{transform:translateY(-34px) rotate(-5deg)}}
.blink{animation:blink 5s infinite;transform-origin:center}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}

/* ---------- PIP REACTIONS ---------- */
.stage .pip{pointer-events:auto;cursor:pointer;-webkit-tap-highlight-color:transparent}
.stage.o .m-smile,.stage.mad .m-smile,.stage.sleep .m-smile{opacity:0}
.stage.o .m-o,.stage.sleep .m-o{opacity:1}
.stage.mad .m-sad{opacity:1}
.brow{opacity:0;transition:opacity .2s}
.stage.mad .brow{opacity:1}
.stage.mad .pip{filter:drop-shadow(0 0 14px rgba(255,80,80,.75))}
.stage.sleep .pupils{opacity:0}
.stage.sleep .blink{animation:none;transform:scaleY(.1)}
.stage .pip.a-wiggle{animation:wig .55s ease-in-out 2}
.stage .pip.a-spin{animation:spinY 1s ease-in-out}
.stage .pip.a-flip{animation:flipZ .9s cubic-bezier(.3,1.3,.5,1)}
.stage .pip.a-squish{animation:squish .6s ease-out}
.stage .pip.a-hop{animation:hopp .5s ease-in-out 2}
.stage .pip.a-shk{animation:shk .12s linear 6}
.stage .pip.a-grow{animation:grw 1.2s ease-in-out}
.stage .pip.a-tilt{animation:tlt 1.3s ease-in-out}
.stage .pip.a-dance{animation:dnc .4s ease-in-out 4}
@keyframes wig{25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@keyframes spinY{to{transform:rotateY(360deg)}}
@keyframes flipZ{to{transform:rotate(360deg)}}
@keyframes squish{30%{transform:scale(1.25,.7)}60%{transform:scale(.88,1.18)}}
@keyframes hopp{50%{transform:translateY(-38px)}}
@keyframes shk{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
@keyframes grw{40%,70%{transform:scale(1.28)}}
@keyframes tlt{30%,70%{transform:rotate(-13deg) translateY(4px)}}
@keyframes dnc{25%{transform:translate(-8px,-12px) rotate(-8deg)}75%{transform:translate(8px,-12px) rotate(8deg)}}
.stage.hi .m-smile{opacity:0}
.stage.hi .m-win{opacity:1}
.stage.wave .hand.r{transform-origin:50% 100%;animation:waveHand .45s ease-in-out infinite alternate}
@keyframes waveHand{from{transform:translate(40px,-64px) rotate(-24deg)}to{transform:translate(40px,-64px) rotate(24deg)}}
.bubble{position:absolute;left:50%;top:-52px;width:max-content;max-width:230px;padding:9px 14px;border-radius:16px;background:#fff6d6;color:#16204a;font-weight:800;font-size:.85rem;line-height:1.25;text-align:center;box-shadow:0 8px 22px rgba(0,0,0,.45);opacity:0;transform:translate(-50%,10px) scale(.8);transition:opacity .2s,transform .3s cubic-bezier(.3,1.5,.5,1);pointer-events:none;z-index:6}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;width:14px;height:14px;background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:0 0 4px 0}
.bubble.on{opacity:1;transform:translate(-50%,0) scale(1)}
.fx{position:absolute;top:34%;font-size:1.5rem;pointer-events:none;animation:fxUp 1.4s ease-out forwards}
@keyframes fxUp{to{transform:translate(var(--x),-120px) scale(1.5);opacity:0}}

.sound-btn{position:fixed;top:14px;right:14px;z-index:20;width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,210,63,.45);background:rgba(16,24,64,.8);color:var(--cream);font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);transition:transform .15s,border-color .2s}
.sound-btn:hover{transform:scale(1.08);border-color:var(--gold)}
.sound-btn:focus-visible{outline:3px solid rgba(255,210,63,.5);outline-offset:2px}
/* ---------- CARD ---------- */
.card{position:relative;width:min(100%,430px);padding:64px 30px 28px;border-radius:30px;border:2px solid rgba(255,210,63,.45);overflow:hidden;
 background:linear-gradient(160deg,rgba(26,38,90,.95),rgba(11,17,46,.97));box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 6px rgba(255,210,63,.06),inset 0 0 60px rgba(255,210,63,.04);
 animation:slow 1.8s 5.6s both cubic-bezier(.2,.8,.2,1)}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.07;background:conic-gradient(#fff 25%,transparent 0 50%,#fff 0 75%,transparent 0) 0 0/28px 28px}
.card.error-pulse{animation:cardError .35s}
@keyframes cardError{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.card h2{font-size:2rem;text-align:center;line-height:1.1}
.sub{text-align:center;color:var(--soft);margin:6px 0 20px;font-size:.92rem}
.error-message{display:none;margin-bottom:14px;padding:11px 14px;border-radius:14px;border:1px solid rgba(255,124,130,.35);background:rgba(255,90,100,.1);color:#ffb0b4;font-size:.86rem;animation:slow .3s both}
.form-group{margin-bottom:15px;position:relative}
label{display:block;margin-bottom:6px;font-weight:700;font-size:.85rem;color:var(--cream);transition:color .2s}
.form-group:focus-within label{color:var(--gold)}
.input-wrap{position:relative}
.input-wrap .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);pointer-events:none;display:flex}
.input-wrap .ico img{width:26px;height:26px;object-fit:contain;filter:drop-shadow(0 0 4px rgba(255,210,63,.5))}
input{width:100%;height:54px;padding:0 16px 0 46px;border-radius:16px;border:2px solid rgba(255,255,255,.12);outline:none;background:rgba(5,9,28,.75);color:var(--text);font-size:1rem;transition:.2s}
input:hover{border-color:rgba(255,255,255,.25)}
input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(255,210,63,.14),0 0 24px rgba(255,210,63,.15);transform:translateY(-1px)}
input::placeholder{color:#6d7aa6}
input:-webkit-autofill{-webkit-text-fill-color:var(--text);-webkit-box-shadow:0 0 0 1000px #0f1738 inset}
.password-input{padding-right:54px}
.password-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:none;border-radius:10px;background:transparent;color:#8e9bc6;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
.password-toggle:hover,.password-toggle[aria-pressed="true"]{color:var(--gold);background:rgba(255,255,255,.06)}
.password-toggle:focus-visible,#loginBtn:focus-visible{outline:3px solid rgba(255,210,63,.5);outline-offset:2px}
.eye{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.loading{display:none;align-items:center;justify-content:center;gap:9px;margin:4px 0 12px;color:var(--gold);font-weight:700;font-size:.9rem}
.spinner{display:flex;animation:spin 1s linear infinite}
.spinner img{width:24px;height:24px}
@keyframes spin{to{transform:rotate(360deg)}}
#loginBtn{position:relative;width:100%;height:58px;border:none;border-radius:18px;overflow:hidden;cursor:pointer;font-weight:800;font-size:1.05rem;color:#2a1a00;
 background:linear-gradient(180deg,#ffe36e,#f5b120);box-shadow:0 6px 0 #b9780c,0 16px 30px rgba(255,190,40,.25);transition:transform .15s,box-shadow .15s,filter .15s}
#loginBtn::before{content:"";position:absolute;top:-40%;left:-80px;width:60px;height:180%;transform:skewX(-22deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transition:left .6s}
#loginBtn:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.05);box-shadow:0 8px 0 #b9780c,0 20px 34px rgba(255,190,40,.3)}
#loginBtn:hover:not(:disabled)::before{left:calc(100% + 60px)}
#loginBtn:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 #b9780c}
#loginBtn:disabled{cursor:not-allowed;color:#d7d9e2;background:linear-gradient(180deg,#5a6075,#454a5c);box-shadow:0 6px 0 #2d3140}
.secure{display:flex;align-items:center;gap:10px;margin-top:20px;padding-top:15px;border-top:1px dashed rgba(255,255,255,.12);color:#8a97c2;font-size:.76rem}
.secure img{width:28px;height:28px;object-fit:contain;flex:0 0 auto}

/* ---------- CHECKMATE ---------- */
.mate{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;flex-direction:column;gap:6px;background:rgba(4,6,26,.86);backdrop-filter:blur(6px);text-align:center}
.mate.on{display:flex;animation:slow .6s both}
.mate .k{animation:jump .8s ease-in-out infinite}
.mate .k img{width:130px;display:block;filter:drop-shadow(0 0 30px rgba(255,210,63,.9))}
.mate h3{font-size:clamp(2rem,7vw,3.4rem)}
.mate p{color:var(--soft)}
.confetti{position:fixed;top:-60px;z-index:95;pointer-events:none;filter:drop-shadow(0 0 6px rgba(255,210,63,.8));animation:fall var(--t) ease-in forwards}
@keyframes fall{to{transform:translate3d(var(--x),110vh,0) rotate(720deg)}}

@media(max-width:480px){.card{padding:62px 20px 22px;border-radius:24px}.knight-run{font-size:2.4rem}.stage{transform:scale(.88)}}
@media(max-height:760px){.tagline{font-size:1.7rem}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}.intro{display:none}}
</style>
</head>
<body>
<main class="world" id="world">

  <div class="floor" aria-hidden="true"></div>
  <div class="glow" aria-hidden="true"></div>
  <div class="drift" id="drift" aria-hidden="true"></div>
  <div class="knight-run" aria-hidden="true"><b><img src="assets/pieces/wN.png" alt=""></b></div>

  <div class="intro" aria-hidden="true">
    <div class="halo"></div><div class="rays"></div>
    <span class="spark" style="left:38%;top:30%;--s:.9s"></span><span class="spark" style="left:62%;top:34%;--s:1.5s"></span>
    <span class="spark" style="left:44%;top:52%;--s:2.1s"></span><span class="spark" style="left:57%;top:24%;--s:.4s"></span>
    <span class="spark" style="left:33%;top:46%;--s:1.2s"></span><span class="spark" style="left:67%;top:48%;--s:1.8s"></span>
    <div class="king"><img src="logo.png" alt=""></div><div class="line"></div><div class="word">OLYMPUS</div>
  </div>

  <div class="brand">
    <img src="favicons.png" alt="Olympus Chess Academy Logo">
    <div><strong>The Olympus Chess Academy</strong><small>Olympus Training Zone</small></div>
  </div>
  <h1 class="tagline">Think Deeper. <em>Rise Higher.</em></h1>

  <!-- Pip the Pawn: eyes follow you, covers eyes for password, celebrates on win -->
  <div class="stage" id="stage" aria-hidden="true">
    <div class="bubble" id="bubble"></div>
    <svg class="pip" viewBox="0 0 200 190">
      <ellipse cx="100" cy="182" rx="62" ry="9" fill="#000" opacity=".35"/>
      <path d="M58 178 Q60 140 78 122 H122 Q140 140 142 178 Z" fill="#fff0b8" stroke="#16204a" stroke-width="4" stroke-linejoin="round"/>
      <rect x="50" y="170" width="100" height="14" rx="7" fill="#f5b120" stroke="#16204a" stroke-width="4"/>
      <ellipse cx="100" cy="122" rx="38" ry="9" fill="#ffd23f" stroke="#16204a" stroke-width="4"/>
      <circle cx="100" cy="78" r="44" fill="#fff6d6" stroke="#16204a" stroke-width="4"/>
      <path d="M72 38 L78 14 L90 30 L100 8 L110 30 L122 14 L128 38 Z" fill="#ffd23f" stroke="#16204a" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="100" cy="8" r="4" fill="#ff8fa3" stroke="#16204a" stroke-width="2"/>
      <circle cx="68" cy="92" r="8" fill="#ff8fa3" opacity=".6"/><circle cx="132" cy="92" r="8" fill="#ff8fa3" opacity=".6"/>
      <g class="blink"><circle cx="82" cy="78" r="13" fill="#fff" stroke="#16204a" stroke-width="3"/><circle cx="118" cy="78" r="13" fill="#fff" stroke="#16204a" stroke-width="3"/></g>
      <g class="pupils" id="pupils"><circle cx="82" cy="78" r="6" fill="#16204a"/><circle cx="118" cy="78" r="6" fill="#16204a"/><circle cx="84" cy="75" r="2" fill="#fff"/><circle cx="120" cy="75" r="2" fill="#fff"/></g>
      <path class="mouth m-smile" d="M88 98 Q100 108 112 98" fill="none" stroke="#16204a" stroke-width="4" stroke-linecap="round"/>
      <ellipse class="mouth m-o" cx="100" cy="104" rx="7" ry="9" fill="#c9304f" stroke="#16204a" stroke-width="4"/>
      <path class="brow" d="M66 60 L94 70 M134 60 L106 70" fill="none" stroke="#16204a" stroke-width="5" stroke-linecap="round"/>
      <path class="mouth m-sad" d="M88 106 Q100 94 112 106" fill="none" stroke="#16204a" stroke-width="4" stroke-linecap="round"/>
      <path class="mouth m-win" d="M86 96 Q100 120 114 96 Z" fill="#c9304f" stroke="#16204a" stroke-width="4" stroke-linejoin="round"/>
      <g class="hand l"><circle cx="76" cy="152" r="17" fill="#fff0b8" stroke="#16204a" stroke-width="4"/><path d="M68 146 v-6M76 144 v-8M84 146 v-6" stroke="#16204a" stroke-width="3" stroke-linecap="round"/></g>
      <g class="hand r"><circle cx="124" cy="152" r="17" fill="#fff0b8" stroke="#16204a" stroke-width="4"/><path d="M116 146 v-6M124 144 v-8M132 146 v-6" stroke="#16204a" stroke-width="3" stroke-linecap="round"/></g>
    </svg>
  </div>

  <section class="card" id="loginCard">
    <h2>Welcome Back</h2>
    <p class="sub">Say hi to Pip, then make your first move.</p>

    <div class="error-message" id="errorMessage" role="alert"></div>

    <div class="form-group">
      <label for="username">Username</label>
      <div class="input-wrap">
        <span class="ico" aria-hidden="true"><img src="assets/pieces/wP.png" alt=""></span>
        <input type="text" id="username" placeholder="Enter your username" autocomplete="username" spellcheck="false">
      </div>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <div class="input-wrap">
        <span class="ico" aria-hidden="true"><img src="assets/pieces/wR.png" alt=""></span>
        <input type="password" id="password" class="password-input" placeholder="Enter your password" autocomplete="current-password">
        <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password" aria-pressed="false">
          <svg class="eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path><circle cx="12" cy="12" r="2.7"></circle></svg>
        </button>
      </div>
    </div>

    <div class="loading" id="loading" aria-live="polite"><span class="spinner" aria-hidden="true"><img src="assets/pieces/wN.png" alt=""></span><span>Entering Olympus...</span></div>

    <button id="loginBtn" type="button">Enter Olympus →</button>

    <div class="secure"><img src="assets/pieces/wK.png" alt=""><span>Protected academy. Students, coaches and administrators only.</span></div>
  </section>
</main>

<button class="sound-btn" id="soundBtn" type="button" aria-label="Mute sounds" aria-pressed="false">🔊</button>

<div class="mate" id="mate" aria-live="polite">
  <div class="k"><img src="assets/pieces/wK.png" alt=""></div><h3>Checkmate!</h3><p>Welcome to Olympus. Setting up your board...</p>
</div>

<script type="module">
import { supabase } from './supabase-client.js';

/* =========================================================
   DOM REFERENCES
   ========================================================= */
const usernameInput = document.getElementById('username');
const passwordInput = document.getElementById('password');
const loginBtn = document.getElementById('loginBtn');
const errorMsg = document.getElementById('errorMessage');
const loading = document.getElementById('loading');
const passwordToggle = document.getElementById('passwordToggle');
const loginCard = document.getElementById('loginCard');

/* visual-only references */
const stage = document.getElementById('stage');
const pupils = document.getElementById('pupils');
const mate = document.getElementById('mate');

/* =========================================================
   SHOW ERROR MESSAGE
   ========================================================= */
function showError(message) {
  errorMsg.textContent = message;
  errorMsg.style.display = 'block';
  loading.style.display = 'none';
  loginBtn.disabled = false;
  loginBtn.textContent = 'Enter Olympus →';

  /* Visual-only feedback */
  loginCard.classList.remove('error-pulse');
  void loginCard.offsetWidth;
  loginCard.classList.add('error-pulse');
  mood('sad');
  say(/Invalid/.test(message) ? 'Hey! That\u2019s a wrong password!' :
      /enter both/.test(message) ? 'Fill in both boxes, champ!' : 'Oops! Something went wrong.', 3200);
}

/* =========================================================
   SHOW LOADING STATE
   ========================================================= */
function showLoading() {
  errorMsg.style.display = 'none';
  loading.style.display = 'flex';
  loginBtn.disabled = true;
  loginBtn.textContent = 'Please wait...';
  mood('');
}

/* =========================================================
   MAIN LOGIN FUNCTION  (logic unchanged)
   ========================================================= */
async function loginUser(username, password) {
  showLoading();

  /* Basic validation */
  if (!username || !password) {
    showError('Please enter both username and password.');
    return false;
  }

  const email = username.includes('@') ? username : username + '@olympuschess.com';
  console.log('Login attempt for:', email);

  try {
    /* 1. SUPABASE AUTHENTICATION */
    const { data: authData, error: authError } = await supabase.auth.signInWithPassword({ email, password });

    if (authError) {
      console.error('Auth error:', authError);
      if (authError.message.includes('Invalid login credentials')) {
        showError('Invalid username or password.');
      } else if (authError.message.includes('Email not confirmed')) {
        showError('Please check your email for verification link.');
      } else {
        showError('Login failed: ' + authError.message);
      }
      return false;
    }

    /* 2. PROFILE LOOKUP */
    const { data: profile, error: profileError } = await supabase
      .from('profiles')
      .select('id, username, role, active')
      .eq('id', authData.user.id)
      .single();

    if (profileError || !profile) {
      await supabase.auth.signOut();
      showError('Access denied. Your account is not authorized.');
      return false;
    }

    if (profile.active === false) {
      await supabase.auth.signOut();
      showError('Your account has been deactivated. Please contact the academy administration.');
      return false;
    }

    if (!['admin', 'student', 'coach'].includes(profile.role)) {
      await supabase.auth.signOut();
      showError('Access denied. Invalid user role.');
      return false;
    }

    console.log('✅ Login successful! Role:', profile.role);

    /* 3. SESSION DATA */
    sessionStorage.setItem('role', profile.role);
    sessionStorage.setItem('username', profile.username || username);
    sessionStorage.setItem('user_id', profile.id);
    sessionStorage.setItem('email', authData.user.email);

    return true;

  } catch (error) {
    console.error('Unexpected error:', error);
    showError('An unexpected error occurred. Please try again.');
    return false;
  }
}

/* =========================================================
   LOGIN BUTTON
   ========================================================= */
loginBtn.addEventListener('click', async () => {
  const username = usernameInput.value.trim();
  const password = passwordInput.value.trim();

  const success = await loginUser(username, password);

  if (success) {
    celebrate();   /* visual-only; short checkmate moment, then same redirect */
    setTimeout(() => { window.location.href = 'mainUI.html'; }, 1800);
  }
});

passwordInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') loginBtn.click();
});

usernameInput.addEventListener('input', () => { errorMsg.style.display = 'none'; });
passwordInput.addEventListener('input', () => { errorMsg.style.display = 'none'; });

passwordToggle.addEventListener('click', () => {
  const passwordVisible = passwordInput.type === 'text';
  passwordInput.type = passwordVisible ? 'password' : 'text';
  passwordToggle.setAttribute('aria-pressed', String(!passwordVisible));
  passwordToggle.setAttribute('aria-label', passwordVisible ? 'Show password' : 'Hide password');
  stage.classList.toggle('peek', !passwordVisible);
  if (!passwordVisible) lookAtPassword();
});

window.onload = () => { usernameInput.focus(); };

/* =========================================================
   PIP THE PAWN  (presentation only)
   ========================================================= */
function mood(state) {
  stage.classList.remove('sad', 'win', 'o', 'mad', 'sleep');
  if (state) stage.classList.add(state);
}

/* eyes follow pointer */
function look(x, y) {
  const r = stage.getBoundingClientRect();
  const dx = x - (r.left + r.width / 2), dy = y - (r.top + r.height * .42);
  const d = Math.max(1, Math.hypot(dx, dy));
  const k = Math.min(6, d / 40);
  pupils.style.transform = `translate(${dx / d * k}px, ${dy / d * k}px)`;
}
function lookAtPassword() {
  const r = passwordInput.getBoundingClientRect();
  look(r.left + r.width / 2, r.top + r.height / 2);
}
window.addEventListener('pointermove', (e) => look(e.clientX, e.clientY));

/* eyes follow the typing caret along the username */
usernameInput.addEventListener('input', () => {
  const r = usernameInput.getBoundingClientRect();
  const f = Math.min(1, usernameInput.value.length / 22);
  look(r.left + 30 + f * (r.width - 60), r.top);
  mood('');
});
usernameInput.addEventListener('focus', () => {
  stage.classList.remove('hide', 'peek');
  const r = usernameInput.getBoundingClientRect();
  look(r.left + r.width / 2, r.top);
});

/* covers eyes while the password is private */
passwordInput.addEventListener('focus', () => {
  stage.classList.add('hide');
  stage.classList.toggle('peek', passwordInput.type === 'text');
  if (passwordInput.type === 'text') lookAtPassword();
  mood('');
});
passwordInput.addEventListener('blur', () => stage.classList.remove('hide', 'peek'));
passwordToggle.addEventListener('mousedown', (e) => e.preventDefault()); /* keep focus so Pip can peek */

/* =========================================================
   PIP REACTIONS  (click him!)
   [text, animation, mood, effect]
   ========================================================= */
const bubble = document.getElementById('bubble');
const pip = stage.querySelector('.pip');
const ANIMS = ['wiggle','spin','flip','squish','hop','shk','grow','tilt','dance'];
const POKES = [
  ['Hey! That tickles!','squish',''],
  ['Hehe, hello there!','hop',''],
  ['Ouch! Be gentle, I am just a pawn!','shk','o'],
  ['Stop poking me!','wiggle','mad'],
  ['Watch out! I might promote!','grow','mad'],
  ['Did you just boop me?','tilt','o'],
  ['I belong on e4, not under your cursor!','dance',''],
  ['Pawns have feelings too...','squish','sad'],
  ['Wheee! I am dizzy!','spin','o'],
  ['Let\u2019s play! You are white.','hop','','\u265F'],
  ['One day I will become a queen!','grow','','\u265B'],
  ['En passant! Too slow!','flip',''],
  ['Knight to f3? Great move!','tilt',''],
  ['Hey, eyes on the board!','wiggle','o'],
  ['Even pawns need a day off...','tilt','sad'],
  ['Check! ...oh, it was just you.','hop','o'],
  ['Your rating just went up +10!','dance','','\u2605'],
  ['Tickle tickle! Hehehe!','wiggle','','\u2665'],
  ['Think before you click!','shk','mad'],
  ['Classic! Pawn to e4!','hop',''],
  ['Stalemate... of my patience!','tilt','mad'],
  ['I am blushing... stop it!','squish','','\u2665'],
  ['Beep boop! Chess bot mode on!','spin',''],
  ['Castle time! Everybody in!','grow',''],
  ['Mate in two clicks!','flip','o'],
  ['Ready to train today?','hop','','\u2605'],
  ['Huh? Who poked me?','shk','o'],
  ['Ouch! My crown!','wiggle','sad'],
  ['Don\u2019t forget your homework!','tilt',''],
  ['Gotcha! You found me!','dance','','\u2665']
];
const ANGRY = ['STOP POKING ME!!','That\u2019s it! I\u2019m calling the arbiter!','Resign already!','Touch-move rule! No more pokes!'];
let bag = [], bubbleT, moodT, animT, idleT, clicks = [], total = 0, asleep = false;

function say(text, ms = 2600) {
  bubble.textContent = text;
  bubble.classList.add('on');
  clearTimeout(bubbleT);
  if (ms) bubbleT = setTimeout(() => bubble.classList.remove('on'), ms);
}
function animate(a) {
  pip.classList.remove(...ANIMS.map(x => 'a-' + x));
  void pip.offsetWidth;
  pip.classList.add('a-' + a);
  clearTimeout(animT);
  animT = setTimeout(() => pip.classList.remove('a-' + a), 1400);
}
function burst(ch) {
  for (let i = 0; i < 6; i++) {
    const h = document.createElement('span');
    h.className = 'fx';
    h.textContent = ch;
    h.style.color = ch === '\u2665' ? '#ff8fa3' : '#ffd23f';
    h.style.left = (30 + Math.random() * 40) + '%';
    h.style.setProperty('--x', (-40 + Math.random() * 80) + 'px');
    h.style.animationDelay = i * .08 + 's';
    stage.appendChild(h);
    setTimeout(() => h.remove(), 1700);
  }
}
function wake() {
  asleep = false;
  mood('o');
  animate('hop');
  say('Oh! I was just resting my eyes!');
  clearTimeout(moodT);
  moodT = setTimeout(() => mood(''), 2400);
}
function resetIdle() {
  clearTimeout(idleT);
  idleT = setTimeout(() => { asleep = true; mood('sleep'); say('Zzz...', 0); }, 15000);
}
function react() {
  if (asleep) { wake(); return; }
  const now = Date.now();
  clicks = clicks.filter(t => now - t < 4000);
  clicks.push(now);
  total++;
  let text, anim, m = '', fx = '';
  if (total === 25) {
    text = 'OK OK, you win! Checkmate!'; anim = 'hop'; m = 'win'; fx = '\u265B';
  } else if (clicks.length >= 6) {
    text = ANGRY[Math.floor(Math.random() * ANGRY.length)]; anim = 'shk'; m = 'mad';
  } else {
    if (!bag.length) bag = POKES.map((_, i) => i).sort(() => Math.random() - .5);
    [text, anim, m, fx] = POKES[bag.pop()];
  }
  mood(m);
  animate(anim);
  say(text, 2800);
  if (fx) burst(fx);
  clearTimeout(moodT);
  moodT = setTimeout(() => mood(''), 2800);
}
/* Pip waves hello right after the intro, when the card appears */
function stopWave() { stage.classList.remove('wave', 'hi'); }
function waveHello() {
  if (asleep || total || document.activeElement === passwordInput) return;
  stage.classList.add('wave', 'hi');
  pupils.style.transform = 'translate(0, 0)';
  animate('hop');
  say('Hi there! Welcome to Olympus!', 3200);
  setTimeout(stopWave, 3200);
}
setTimeout(waveHello, window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 700 : 6800);
passwordInput.addEventListener('focus', stopWave);
pip.addEventListener('pointerdown', stopWave);
pip.addEventListener('pointerdown', react);
['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, resetIdle));
resetIdle();

/* gentle reactions to what the student is doing */
usernameInput.addEventListener('focus', () => { if (!total) say('Who goes there? Type your name!'); }, { once: true });
passwordInput.addEventListener('focus', () => say('I\u2019m not looking... promise!', 2200), { once: true });
passwordToggle.addEventListener('click', () => { if (passwordInput.type === 'text') say('Okay, I peeked a little!', 2200); });

/* =========================================================
   SOUND  (only the login.mp3 music; the speaker button mutes it)
   ========================================================= */
const soundBtn = document.getElementById('soundBtn');
let muted = false;
try { muted = localStorage.getItem('olympusMute') === '1'; } catch (e) {}

function paintSoundBtn() {
  soundBtn.textContent = muted ? '\u{1F507}' : '\u{1F50A}';
  soundBtn.setAttribute('aria-pressed', String(muted));
  soundBtn.setAttribute('aria-label', muted ? 'Unmute sounds' : 'Mute sounds');
}
paintSoundBtn();

soundBtn.addEventListener('click', () => {
  muted = !muted;
  try { localStorage.setItem('olympusMute', muted ? '1' : '0'); } catch (e) {}
  paintSoundBtn();
  if (muted) bgm.pause(); else tryMusic();
});

/* =========================================================
   BACKGROUND MUSIC  (sounds/login.mp3, loops from the king intro)
   Tries to autoplay as soon as the page opens. If the browser blocks
   sound without a gesture, it starts on the first touch, click or key.
   ========================================================= */
const bgm = new Audio('sounds/login.mp3');   /* music file: sounds/login.mp3 */
bgm.loop = true;
bgm.volume = .35;
bgm.preload = 'auto';
const UNLOCK = ['pointerdown', 'keydown', 'touchstart', 'click'];

function tryMusic() {
  if (muted || document.hidden || !bgm.paused) return;
  bgm.play()
    .then(() => UNLOCK.forEach(ev => document.removeEventListener(ev, tryMusic)))
    .catch(() => {});                  /* blocked by the browser: retried on the first gesture below */
}
tryMusic();                            /* 1) try to autoplay the moment the king appears */
window.addEventListener('load', tryMusic);
bgm.addEventListener('canplaythrough', tryMusic, { once: true });
UNLOCK.forEach(ev => document.addEventListener(ev, tryMusic));   /* 2) fallback: very first touch, click or key */

document.addEventListener('visibilitychange', () => {
  if (document.hidden) bgm.pause(); else tryMusic();
});

function fadeOutMusic() {
  const f = setInterval(() => {
    bgm.volume = Math.max(0, bgm.volume - .035);
    if (bgm.volume <= 0) { clearInterval(f); bgm.pause(); }
  }, 80);
}


/* real piece images from assets/pieces */
const PIECES = ['bB','bK','bN','bP','bQ','bR','wB','wK','wN','wP','wQ','wR'];
const pieceSrc = (n) => `assets/pieces/${n}.png`;

/* =========================================================
   SUCCESS CELEBRATION
   ========================================================= */
function celebrate() {
  stage.classList.remove('hide', 'peek');
  mood('win');
  fadeOutMusic();
  say('Checkmate! You did it!', 0);
  loading.style.display = 'none';
  mate.classList.add('on');
  for (let i = 0; i < 38; i++) {
    const c = document.createElement('img');
    c.className = 'confetti';
    c.alt = '';
    c.src = pieceSrc(PIECES[i % PIECES.length]);
    c.style.left = Math.random() * 100 + 'vw';
    c.style.width = 26 + Math.random() * 30 + 'px';
    c.style.setProperty('--x', (-80 + Math.random() * 160) + 'px');
    c.style.setProperty('--t', 1.6 + Math.random() * 1.4 + 's');
    c.style.animationDelay = Math.random() * .5 + 's';
    document.body.appendChild(c);
  }
}

/* =========================================================
   FLOATING CHESS PIECES BACKGROUND
   ========================================================= */
(function buildDrift() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = document.getElementById('drift');
  const n = window.innerWidth < 700 ? 10 : 20;
  for (let i = 0; i < n; i++) {
    const s = document.createElement('img');
    s.alt = '';
    s.src = pieceSrc(PIECES[i % PIECES.length]);
    if (i % 4 === 0) s.className = 'g';
    s.style.left = Math.random() * 100 + '%';
    s.style.width = 34 + Math.random() * 46 + 'px';
    s.style.setProperty('--d', 16 + Math.random() * 20 + 's');
    s.style.setProperty('--l', -Math.random() * 30 + 's');
    s.style.setProperty('--x', (-60 + Math.random() * 120) + 'px');
    s.style.setProperty('--r', (-40 + Math.random() * 80) + 'deg');
    box.appendChild(s);
  }
})();
</script>
</body>
</html>
